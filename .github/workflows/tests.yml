name: Testes

# Roda a suíte a cada push (em qualquer branch) e em pull requests.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi/requirements*.txt

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi/requirements-dev.txt

      # O pytest sai com código diferente de zero se qualquer teste falhar,
      # e isso faz o job (e o workflow) terminar com erro.
      - name: Executar os testes
        run: pytest tests/ -v
